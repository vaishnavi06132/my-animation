<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Holi Color Animation</title>
</head>
<body>

    <canvas id="myCanvas"></canvas>
    <div style="position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); text-align: center;">
        
        <p style="color: rgb(124, 237, 98); font-size: 30px; font-family: Georgia, 'Times New Roman', Times, serif;">
            THE COUNTDOWN TO MIDNIGHT HAS BEGUN!
        </p>
        <p style="color: rgb(226, 158, 209); font-size: 25px; font-style: italic;">
            Until the colors fade into midnight...
        </p>


        <button id="clockButton" style="background-color: rgba(101, 115, 208, 0.974); height: 60px; width: 150px; font-size: 20px;">
            REVEAL THE COUNTDOWN
        </button>
    </div>
    <script src="script.js"></script>

</body>
</html>
